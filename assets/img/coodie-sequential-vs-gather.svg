<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 150" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Before: two queries run one after the other. After: both run at the same time and the request finishes when the slower one returns.">
  <rect width="640" height="150" fill="#ffffff"/>

  <!-- before: sequential -->
  <text x="10" y="35" font-size="14" font-weight="bold" fill="#1f3b73">before</text>
  <rect x="80" y="18" width="240" height="26" rx="4" fill="#1f3b73"/>
  <text x="200" y="36" font-size="12" fill="#ffffff" text-anchor="middle">owned plans</text>
  <rect x="320" y="18" width="200" height="26" rx="4" fill="#2f9e8f"/>
  <text x="420" y="36" font-size="12" fill="#ffffff" text-anchor="middle">participating plans</text>

  <!-- after: parallel -->
  <text x="10" y="90" font-size="14" font-weight="bold" fill="#1f3b73">after</text>
  <rect x="80" y="62" width="240" height="26" rx="4" fill="#1f3b73"/>
  <text x="200" y="80" font-size="12" fill="#ffffff" text-anchor="middle">owned plans</text>
  <rect x="80" y="92" width="200" height="26" rx="4" fill="#2f9e8f"/>
  <text x="180" y="110" font-size="12" fill="#ffffff" text-anchor="middle">participating plans</text>

  <!-- time saved -->
  <rect x="324" y="62" width="196" height="56" rx="4" fill="#8fd0e8" fill-opacity="0.3"/>
  <text x="422" y="95" font-size="12" fill="#1f3b73" text-anchor="middle">time saved</text>

  <!-- axis -->
  <line x1="80" y1="134" x2="600" y2="134" stroke="#888888" stroke-width="1.2"/>
  <polygon points="600,130 608,134 600,138" fill="#888888"/>
  <text x="608" y="148" font-size="11" fill="#666666" text-anchor="end">time</text>
</svg>
